name: Build RemoControl iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Seleccionar Xcode 26.6
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Instalar workload MAUI iOS
        shell: bash
        run: |
          dotnet workload install maui-ios

      - name: Restaurar solamente iOS
        shell: bash
        run: |
          dotnet restore \
            RemoControlMobile/RemoControlMobile.csproj \
            -p:TargetFrameworks=net10.0-ios

      - name: Compilar aplicación iOS sin firma
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish \
            RemoControlMobile/RemoControlMobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            --no-restore \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false

      - name: Buscar aplicación compilada
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(
            find RemoControlMobile/bin/Release/net10.0-ios \
              -type d \
              -name "*.app" \
              | head -n 1
          )

          if [ -z "$APP_PATH" ]; then
            echo "No se encontró el archivo .app"

            find RemoControlMobile/bin/Release \
              -maxdepth 8 \
              -print || true

            exit 1
          fi

          echo "Aplicación encontrada:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Crear IPA para ESign
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -qry RemoControlMobile-ESign.ipa Payload

          if [ ! -f RemoControlMobile-ESign.ipa ]; then
            echo "No se pudo crear el IPA."
            exit 1
          fi

          echo "IPA creado correctamente:"
          ls -lh RemoControlMobile-ESign.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoControlMobile-ESign-IPA
          path: RemoControlMobile-ESign.ipa
          if-no-files-found: error
          retention-days: 14
