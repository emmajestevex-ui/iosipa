name: Build RemoControl iOS Unsigned

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload iOS
        run: dotnet workload install maui-ios

      - name: Restaurar iOS
        run: |
          dotnet restore RemoControlMobile/RemoControlMobile.csproj \
            -p:TargetFrameworks=net10.0-ios

      - name: Compilar iOS sin firma
        run: |
          dotnet build RemoControlMobile/RemoControlMobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:TargetFrameworks=net10.0-ios \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false

      - name: Buscar APP
        run: |
          find RemoControlMobile/bin/Release -type d -name "*.app" -print

      - name: Crear IPA sin firmar
        run: |
          APP_PATH=$(find RemoControlMobile/bin/Release -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No se encontró ningún .app"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r RemoControlMobile-unsigned.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoControlMobile-Unsigned-IPA
          path: RemoControlMobile-unsigned.ipa
