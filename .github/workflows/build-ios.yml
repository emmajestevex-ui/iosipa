name: Build RemoControl iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Mostrar Xcode
        run: xcodebuild -version

      - name: Instalar workload MAUI iOS
        run: dotnet workload install maui-ios

      - name: Restaurar proyecto
        run: dotnet restore RemoControlMobile/RemoControlMobile.csproj

      - name: Verificar secretos de firma
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
        run: |
          test -n "$IOS_CERTIFICATE_P12_BASE64" || (echo "Falta el secret IOS_CERTIFICATE_P12_BASE64" && exit 1)
          test -n "$IOS_CERTIFICATE_PASSWORD" || (echo "Falta el secret IOS_CERTIFICATE_PASSWORD" && exit 1)
          test -n "$IOS_PROVISION_PROFILE_BASE64" || (echo "Falta el secret IOS_PROVISION_PROFILE_BASE64" && exit 1)
          test -n "$IOS_CODESIGN_KEY" || (echo "Falta el secret IOS_CODESIGN_KEY" && exit 1)

      - name: Instalar certificado y provisioning profile
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/remocontrol-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/remocontrol.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/remocontrol-build.keychain-db"
          KEYCHAIN_PASSWORD="remocontrol-ci-${GITHUB_RUN_ID}"

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "Provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Publicar IPA firmado
        env:
          IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: >-
          dotnet publish RemoControlMobile/RemoControlMobile.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey="$IOS_CODESIGN_KEY"
          -p:CodesignProvision="$PROFILE_UUID"

      - name: Localizar IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find RemoControlMobile/bin/Release/net10.0-ios/ios-arm64 -type f -name '*.ipa' | head -n 1)
          if [ -z "$IPA" ]; then
            echo "No se encontró ningún IPA."
            find RemoControlMobile/bin/Release/net10.0-ios/ios-arm64 -maxdepth 4 -type f || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$IPA" artifacts/RemoControlMobile.ipa
          echo "path=artifacts/RemoControlMobile.ipa" >> "$GITHUB_OUTPUT"

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoControlMobile-iOS-IPA
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14
