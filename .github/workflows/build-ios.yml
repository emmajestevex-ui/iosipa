name: Build RemoControl iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar workloads
        run: dotnet workload restore RemoControlMobile/RemoControlMobile.csproj

      - name: Compilar iPhone
        run: |
          dotnet publish RemoControlMobile/RemoControlMobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true

      - name: Buscar IPA
        if: always()
        run: find . -type f -name "*.ipa" -print

      - name: Guardar IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RemoControlMobile-IPA
          path: "**/*.ipa"
          if-no-files-found: warn
