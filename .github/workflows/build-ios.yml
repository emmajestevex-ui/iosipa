name: Build MSI Center iOS ESign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Mostrar Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Instalar workload MAUI iOS
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install maui-ios

      - name: Restaurar iOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore RemoControlMobile/RemoControlMobile.csproj \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64

      - name: Compilar aplicación iOS sin firma
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish RemoControlMobile/RemoControlMobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            --no-restore \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false

      - name: Buscar aplicación compilada
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(
            find RemoControlMobile/bin/Release/net10.0-ios \
              -type d \
              -name "*.app" \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no se encontró ningún archivo .app"
            find RemoControlMobile/bin/Release -maxdepth 8 -print || true
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Aplicación encontrada: $APP_PATH"

      - name: Crear IPA para ESign
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          rm -rf Payload
          rm -f MSICenter_iOS_ESign.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MSICenter_iOS_ESign.ipa Payload
          test -f MSICenter_iOS_ESign.ipa
          ls -lh MSICenter_iOS_ESign.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: MSICenter-iOS-ESign-IPA
          path: MSICenter_iOS_ESign.ipa
          if-no-files-found: error
          retention-days: 14
