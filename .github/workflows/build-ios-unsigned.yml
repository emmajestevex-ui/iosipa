name: Crear IPA para firmar con ESign

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Compilar RemoControl iOS
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload de iOS para MAUI
        run: |
          dotnet workload install maui-ios

      - name: Restaurar paquetes solo iOS
        run: |
          dotnet restore RemoControlMobile/RemoControlMobile.csproj \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64

      # Se usa firma ad-hoc solo para permitir que las herramientas de Apple
      # terminen la compilación del bundle de dispositivo. No se usa ningún
      # certificado ni provisioning profile del usuario.
      - name: Compilar app iOS para dispositivo
        run: |
          dotnet publish RemoControlMobile/RemoControlMobile.csproj \
            -f net10.0-ios \
            -c Release \
            --no-restore \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey=- \
            -p:CodesignProvision= \
            -p:BuildIpa=false

      - name: Encontrar RemoControl.app
        id: find_app
        shell: bash
        run: |
          set -e
          APP_PATH=$(find RemoControlMobile/bin/Release/net10.0-ios -type d -name "RemoControlMobile.app" -o -name "RemoControl.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find RemoControlMobile/bin/Release/net10.0-ios -type d -name "*.app" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró el .app generado."
            find RemoControlMobile/bin/Release/net10.0-ios -maxdepth 6 -type d || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "App encontrada en: $APP_PATH"

      # Quita perfiles y firmas para dejar el paquete listo para que ESign
      # vuelva a firmar todos los ejecutables y frameworks con tu certificado.
      - name: Quitar firma y provisioning
        shell: bash
        run: |
          set -e
          rm -f "$APP_PATH/embedded.mobileprovision" || true
          rm -rf "$APP_PATH/_CodeSignature" || true

          # Quitar firmas de binarios Mach-O dentro del bundle cuando sea posible.
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --remove-signature "$f" 2>/dev/null || true
            fi
          done < <(find "$APP_PATH" -type f -print0)

          # Quitar carpetas de firma que puedan quedar en frameworks/plugins.
          find "$APP_PATH" -type d -name "_CodeSignature" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -name "embedded.mobileprovision" -delete 2>/dev/null || true

      - name: Crear IPA sin certificado personal
        shell: bash
        run: |
          set -e
          rm -rf ipa-output Payload
          mkdir -p ipa-output Payload
          cp -R "$APP_PATH" Payload/RemoControl.app
          /usr/bin/zip -qry "ipa-output/RemoControl-UNSIGNED.ipa" Payload
          echo "IPA creada:"
          ls -lh ipa-output/RemoControl-UNSIGNED.ipa

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RemoControl-IPA-SIN-FIRMA
          path: ipa-output/RemoControl-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 30
