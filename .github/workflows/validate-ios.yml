name: Validate MSI Center iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'RemoControlMobile/**'
      - '.github/workflows/validate-ios.yml'

permissions:
  contents: read

jobs:
  validate-ios:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Seleccionar Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Instalar workload MAUI iOS
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install maui-ios

      - name: Restaurar simulador iOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore RemoControlMobile/RemoControlMobile.csproj \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64

      - name: Compilar iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          dotnet build RemoControlMobile/RemoControlMobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r iossimulator-arm64 \
            --no-restore \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision=""
