name: Validate RemoControl iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Mostrar Xcode
        run: xcodebuild -version

      - name: Instalar workload MAUI iOS
        run: dotnet workload install maui-ios

      - name: Restaurar solamente iOS
        run: |
          dotnet restore RemoControlMobile/RemoControlMobile.csproj \
            -p:TargetFrameworks=net10.0-ios

      - name: Compilar iOS Simulator
        run: |
          dotnet build RemoControlMobile/RemoControlMobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r iossimulator-arm64 \
            --no-restore \
            -p:TargetFrameworks=net10.0-ios
